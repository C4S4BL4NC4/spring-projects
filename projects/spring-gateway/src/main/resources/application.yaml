spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: spring-rest-mvc
              uri: http://localhost:8081
              predicates:
                - Path=/api/mvc/**
            - id: spring-reactive
              uri: http://localhost:8082
              predicates:
                - Path=/api/reactive/**
            - id: spring-reactive-mongo
              uri: http://localhost:8083
              predicates:
                - Path=/api/reactive-mongo/**
            - id: spring-auth-server
              uri: http://localhost:9000
              predicates:
                - Path=/oauth2/**, /.well-known/**
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
