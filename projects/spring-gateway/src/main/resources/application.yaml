spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: spring-rest-mvc
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/**
            - id: spring-reactive
              uri: http://localhost:8082
              predicates:
                - Path=/api/v2/**
            - id: spring-reactive-mongo
              uri: http://localhost:8083
              predicates:
                - Path=/api/v3/**
            - id: spring-auth-server
              uri: http://localhost:9000
              predicates:
                - Path=/oauth2/**, /.well-known/**
