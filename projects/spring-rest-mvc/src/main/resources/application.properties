spring.application.name=spring-rest-mvc
logging.level.com=debug
# Default (no profile): in-memory H2, used by the tests.
# Run with the "mysql" profile to use the MySQL container instead.
# Seed data.sql on every startup, after Hibernate has created the tables
spring.sql.init.mode=always
spring.flyway.enabled=false
spring.jpa.defer-datasource-initialization=true
# Spring Security credentials (used by the tests too)
spring.security.user.name=user
spring.security.user.password=password
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
